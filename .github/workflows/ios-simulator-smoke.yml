name: Existing iOS bundle smoke test
on:
  push:
    branches: [codex/ios-simulator-smoke-20261128]
    paths: [.github/workflows/ios-simulator-smoke.yml, scripts/ios-simulator-smoke.py]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Launch verified bundles in an isolated iPhone simulator
        run: python3 scripts/ios-simulator-smoke.py
