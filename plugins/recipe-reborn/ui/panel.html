<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Reborn kitchen</title>
<style>:root{font:16px system-ui;color:#173d2c;background:#f8f6ee}body{margin:0;padding:22px;max-width:760px}h1{font:32px Georgia;margin:0}header p{color:#586354}button,input,select{font:inherit;padding:10px 14px;border:1px solid #aebcae;border-radius:9px}button{cursor:pointer;background:#204d35;color:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}form{display:flex;gap:8px}input{min-width:0;flex:1}article{background:white;border:1px solid #d9dfd1;border-radius:14px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui}button:disabled{opacity:.5}#status{min-height:24px}#confirm{background:#ae4a13}li{margin:8px 0}</style></head>
<body><header><h1>Recipe Reborn</h1><p>Your recipes. Your ingredients. Your kitchen.</p></header>
<nav><button data-tool="search_recipes">My recipes</button><button data-tool="read_meal_plans">Meal plans</button><button data-tool="read_shopping_lists">Shopping lists</button><button data-tool="account_status">Membership</button></nav>
<form id="search"><input id="query" aria-label="Search saved recipes" placeholder="Search my recipes"><button>Find recipes</button></form>
<p id="status" role="status">Connecting to your linked account…</p><main id="results"></main>
<script type="module">
const result=document.querySelector('#results'),status=document.querySelector('#status');
let serial=0;const pending=new Map();let ready=false;
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++serial;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Connection timed out.'))},300000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
function render(response){result.replaceChildren();if(response.isError){status.textContent=response.content?.[0]?.text||'Unable to complete request.';return}status.textContent='';const data=response.structuredContent;if(!data)return;
 if(data.recipes){for(const r of data.recipes){const card=document.createElement('article');card.append(text('h2',r.title));const b=text('button','Open recipe');b.onclick=()=>call('read_recipe',{recipeId:r.id});card.append(b);result.append(card)}if(!data.recipes.length)result.append(text('p','No matching saved recipes.'));return}
 if(data.title&&data.freshIngredients){const card=document.createElement('article');card.append(text('h2',data.title));const list=document.createElement('ul');for(const ingredient of data.freshIngredients)list.append(text('li',ingredient));card.append(list);const steps=document.createElement('ol');for(const step of data.instructions||[])steps.append(text('li',step));card.append(steps);for(const factor of [1,2,3]){const b=text('button',factor+'× ingredients');b.onclick=()=>call('adjust_servings',{recipeId:data.id,factor});card.append(b)}if(data.note)card.append(text('p',data.note));result.append(card);return}
 if(data.shoppingLists||data.shoppingList){const lists=data.shoppingLists||[data.shoppingList];for(const list of lists){const card=document.createElement('article');card.append(text('h2',list.name));const ul=document.createElement('ul');for(const item of list.items||[])ul.append(text('li',typeof item==='string'?item:(item.checked?'✓ ':'')+[item.quantity,item.unit,item.ingredient].filter(Boolean).join(' ')));card.append(ul);result.append(card)}if(!lists.length)result.append(text('p','No shopping lists yet. Ask your assistant to prepare one from your saved recipes.'));return}
 if(data.mealPlans){for(const plan of data.mealPlans){const card=document.createElement('article');card.append(text('h2',plan.name||'Weekly meal plan'));card.append(text('p',String(plan.weekStartDate||'').slice(0,10)));for(const meal of plan.mealPlanRecipes||[]){const b=text('button',[meal.day,meal.mealType,meal.recipe.title].join(' · '));b.onclick=()=>call('read_recipe',{recipeId:meal.recipe.id});card.append(b)}result.append(card)}if(!data.mealPlans.length)result.append(text('p','No meal plans yet. Ask your assistant to prepare a week for your review.'));return}
 if('premium' in data||data.membership){const card=document.createElement('article');card.append(text('h2',data.membership||(data.premium?'Premium access active':'Free membership')));card.append(text('p','Recipes generated this period: '+(data.generationCount??0)));card.append(text('p','Membership and usage limits are checked by Recipe Reborn. This panel does not change billing.'));result.append(card);return}
 const card=document.createElement('article');card.append(text('h2',data.confirmationRequired?'Review before continuing':'Recipe Reborn result'));card.append(text('pre',JSON.stringify(data.confirmationRequired?data.action:data,null,2)));if(data.effects)card.append(text('p',data.effects));if(data.sourceTitles?.length)card.append(text('p','Recipes: '+data.sourceTitles.join(', ')));result.append(card);
 if(data.confirmationRequired&&data.confirmationId){card.append(text('p','Review the exact details above. This uses your existing account; AI actions can consume your allowance.'));const button=text('button','Confirm this action');button.id='confirm';button.onclick=()=>{button.disabled=true;call('execute_action',{confirmationId:data.confirmationId,confirmed:true})};card.append(button)}
}
async function call(name,args={}){if(!ready)return;status.textContent='Working…';try{render(await rpc('tools/call',{name,arguments:args}))}catch{status.textContent='Could not finish. Check your account before retrying a write.'}}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(m?.jsonrpc!=='2.0')return;if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result')render(m.params)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>call(b.dataset.tool));document.querySelector('#search').onsubmit=e=>{e.preventDefault();call('search_recipes',{query:document.querySelector('#query').value})};
try{await rpc('ui/initialize',{appInfo:{name:'recipe-reborn',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');ready=true;status.textContent='Choose a tool or ask your assistant to prepare a recipe or meal plan.'}catch{status.textContent='Open this panel in an MCP Apps-compatible host with Recipe Reborn connected.'}
</script></body></html>
